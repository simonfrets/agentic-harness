name: harness

# Local hooks can be skipped; CI cannot. Everything the pre-commit hook enforces
# runs again here.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the TDD gate diffs against the base ref

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npx eslint . --max-warnings 0

      - name: shell lint
        run: find . -path ./node_modules -prune -o -name '*.sh' -print0 | xargs -0 -r shellcheck -s sh -x

      - name: tests with coverage
        run: npm test -- --coverage

      - name: tdd pair gate
        if: github.event_name == 'pull_request'
        run: sh node_modules/agentic-harness/runtime/tdd/guard.sh --range origin/${{ github.base_ref }}...HEAD

      - name: harness doctor
        run: npx harness doctor
