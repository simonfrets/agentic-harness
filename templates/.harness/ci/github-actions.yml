# Managed by Agentic Harness.
#
# This file does nothing where it sits. Copy it to .github/workflows/ in this
# project to make it run:
#
#     mkdir -p .github/workflows
#     cp .harness/ci/github-actions.yml .github/workflows/harness.yml
#
# The harness deliberately installs nothing outside .harness/, so placing a
# workflow is the project's decision to make. It is worth making: a git hook
# is skippable with `git commit --no-verify`, so the hooks the harness
# installs are a convenience. Only CI is an enforcement.
name: Harness gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Harness gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The gates run this project's own scripts, so its dependencies have to
      # be present before any of them can run.
      - name: Install project dependencies
        run: npm ci

      # .harness/node_modules is machine-local and git-ignored, so the private
      # tree is resolved here. This needs .harness/package-lock.json to be
      # committed; `harness init` produces it. Use `npm install --omit=dev` if
      # you have deliberately not committed that lockfile.
      - name: Resolve the harness runtime
        run: npm ci --omit=dev
        working-directory: .harness

      # Both phases run, because they check different things: pre-commit
      # carries lint and type checking, pre-push carries the build.
      #
      # One caveat worth knowing: a rule whose check inspects staged content,
      # such as the shipped `git diff --check --cached`, has nothing to look at
      # here, because CI has no index. Those rules are enforced by the hook
      # alone.
      - name: pre-commit gate
        run: ./.harness/bin/harness gate pre-commit

      - name: pre-push gate
        run: ./.harness/bin/harness gate pre-push
